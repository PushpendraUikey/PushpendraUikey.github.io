---
layout: default
---
<article class="post">
    <a class="back" href="/blog/">← All posts</a>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</p>
    <div class="post-body">
        {{ content }}
    </div>
</article>
